<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Form Autofill JP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="popup">
  <main>
    <div>
      <h1 class="app-name">Form Autofill JP</h1>
      <p id="who" class="who muted">プロフィールを読み込んでいます</p>
    </div>
    <div>
      <button id="fill" class="button block" type="button">このページに入力</button>
      <label class="checkbox">
        <span class="box"><input id="overwrite" type="checkbox"></span>
        <span>入力済みの欄も上書きする</span>
      </label>
    </div>
    <div id="status" class="banner" role="status" hidden>
      <span id="status-icon" aria-hidden="true"></span>
      <p id="status-text"></p>
    </div>
    <div class="foot">
      <a href="options.html" id="edit">プロフィールを編集</a>
      <span class="shortcut">ショートカット：<kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>F</kbd></span>
    </div>
  </main>
  <script src="icons.js"></script>
  <script src="popup.js"></script>
</body>
</html>
