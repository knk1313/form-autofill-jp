<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Form Autofill JP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="popup">
  <p id="who" class="muted">プロフィールを読み込んでいます…</p>
  <button id="fill" class="primary" type="button">このページに入力</button>
  <label class="check"><input id="overwrite" type="checkbox"> 入力済みの欄も上書きする</label>
  <p id="status" role="status" aria-live="polite"></p>
  <p class="foot"><a href="#" id="edit">プロフィールを編集</a><span class="muted">Alt+Shift+F でも入力できます</span></p>
  <script src="popup.js"></script>
</body>
</html>
