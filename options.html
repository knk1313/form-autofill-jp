<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>プロフィール - Form Autofill JP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="options">
  <form id="profile" autocomplete="off" novalidate>
    <main>
      <header class="page-header">
        <h1>プロフィール</h1>
        <p>フォームに入れる内容を登録します。内容はこのパソコンのChromeの中にだけ保存し、外へは送りません。</p>
      </header>

      <section class="card" aria-labelledby="sec-name">
        <div class="section">
          <div class="section-head">
            <h2 id="sec-name">名前</h2>
          </div>
          <div class="section-body">
            <div class="field"><label for="lastName">姓</label><input class="input" id="lastName" name="lastName" placeholder="例：山田"></div>
            <div class="field"><label for="firstName">名</label><input class="input" id="firstName" name="firstName" placeholder="例：太郎"></div>
            <div class="field"><label for="lastKana">セイ</label><input class="input" id="lastKana" name="lastKana" placeholder="例：ヤマダ" data-kana></div>
            <div class="field"><label for="firstKana">メイ</label><input class="input" id="firstKana" name="firstKana" placeholder="例：タロウ" data-kana></div>
            <div class="field"><label for="lastEn">姓（ローマ字）</label><input class="input" id="lastEn" name="lastEn" placeholder="例：Yamada"></div>
            <div class="field"><label for="firstEn">名（ローマ字）</label><input class="input" id="firstEn" name="firstEn" placeholder="例：Taro"></div>
          </div>
        </div>
      </section>

      <section class="card" aria-labelledby="sec-contact">
        <div class="section">
          <div class="section-head">
            <h2 id="sec-contact">連絡先</h2>
          </div>
          <div class="section-body">
            <div class="field"><label for="email">メールアドレス</label><input class="input" id="email" name="email" placeholder="例：taro@example.com" type="email"></div>
            <div class="field"><label for="tel">電話番号</label><input class="input" id="tel" name="tel" placeholder="例：090-1234-5678" type="tel"></div>
          </div>
        </div>
      </section>

      <section class="card" aria-labelledby="sec-address">
        <div class="section">
          <div class="section-head">
            <h2 id="sec-address">住所</h2>
          </div>
          <div class="section-body">
            <div class="field"><label for="postal">郵便番号</label><input class="input" id="postal" name="postal" placeholder="例：100-0001" inputmode="numeric"></div>
            <div class="field"><label for="prefecture">都道府県</label><span class="select"><select id="prefecture" name="prefecture"><option value="">選択してください</option></select></span></div>
            <div class="field"><label for="city">市区町村</label><input class="input" id="city" name="city" placeholder="例：千代田区"></div>
            <div class="field"><label for="street">番地</label><input class="input" id="street" name="street" placeholder="例：千代田1-1-1"></div>
            <div class="field wide"><label for="building">建物名・部屋番号</label><input class="input" id="building" name="building" placeholder="例：〇〇マンション101"></div>
          </div>
        </div>
      </section>

      <section class="card" aria-labelledby="sec-address-en">
        <div class="section">
          <div class="section-head">
            <h2 id="sec-address-en">住所（英語）</h2>
          </div>
          <div class="section-body">
            <div class="field wide"><label for="line1En">Address line 1</label><input class="input" id="line1En" name="line1En" placeholder="e.g. 1-1-1 Chiyoda" lang="en"></div>
            <div class="field wide"><label for="line2En">Address line 2</label><input class="input" id="line2En" name="line2En" placeholder="e.g. Room 101, XX Mansion" lang="en"></div>
            <div class="field"><label for="cityEn">City</label><input class="input" id="cityEn" name="cityEn" placeholder="e.g. Chiyoda-ku" lang="en"></div>
            <div class="field"><span class="label" id="prefEn-label">State / Prefecture</span><output id="prefEn" aria-labelledby="prefEn-label" class="muted">—</output></div>
          </div>
        </div>
      </section>

      <section class="card" aria-labelledby="sec-birth">
        <div class="section">
          <div class="section-head">
            <h2 id="sec-birth">生年月日・性別</h2>
          </div>
          <div class="section-body">
            <div class="field">
              <label for="birthday">生年月日（西暦）</label>
              <input class="input date" id="birthday" name="birthday" placeholder="例：1990-01-23" inputmode="numeric" autocomplete="off" aria-describedby="wareki birthday-error">
              <p id="birthday-error" class="error" hidden></p>
              <p id="wareki" class="support"></p>
            </div>
            <div class="field">
              <label for="gender">性別</label>
              <span class="select">
                <select id="gender" name="gender">
                  <option value="">入力しない</option>
                  <option value="male">男性</option>
                  <option value="female">女性</option>
                  <option value="other">その他</option>
                </select>
              </span>
            </div>
          </div>
        </div>
      </section>

      <section class="card" aria-labelledby="sec-work">
        <div class="section">
          <div class="section-head">
            <h2 id="sec-work">勤務先</h2>
          </div>
          <div class="section-body">
            <div class="field"><label for="company">会社名</label><input class="input" id="company" name="company"></div>
            <div class="field"><label for="department">部署</label><input class="input" id="department" name="department"></div>
          </div>
        </div>
      </section>

      <div class="action-panel">
        <button class="button" type="submit">保存する</button>
        <div id="saved" class="banner" role="status" hidden>
          <span aria-hidden="true"></span>
          <p></p>
        </div>
      </div>
    </main>
  </form>
  <script src="fill.js"></script>
  <script src="icons.js"></script>
  <script src="options.js"></script>
</body>
</html>
