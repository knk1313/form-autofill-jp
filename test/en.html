<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>English form sample</title>
  <style>body{font-family:sans-serif;max-width:760px;margin:24px auto;padding:0 16px}label{display:block;margin:8px 0}</style>
</head>
<body>
  <!-- data-expect は、テスト用のプロフィール（test/profile.json）で入るべき値 -->
  <h1>English form sample</h1>

  <h2>Checkout</h2>
  <form id="checkout">
    <label>First name <input name="fname" autocomplete="given-name" data-expect="Taro"></label>
    <label>Last name <input name="lname" autocomplete="family-name" data-expect="Yamada"></label>
    <label>Email <input type="email" name="email" data-expect="taro@example.com"></label>
    <label>Phone <input type="tel" name="phone" data-expect="090-1234-5678"></label>
    <label>Address line 1 <input name="address1" data-expect="1-1-1 Chiyoda"></label>
    <label>Address line 2 <input name="address2" data-expect="Room 101"></label>
    <label>City <input name="city" data-expect="Chiyoda-ku"></label>
    <label>State / Province <input name="state" data-expect="Tokyo"></label>
    <label>ZIP / Postal code <input name="zip" data-expect="100-0001"></label>
    <label>Country
      <select name="country" data-expect="JP"><option value="">Select…</option><option value="US">United States</option><option value="JP">Japan</option></select>
    </label>
    <fieldset>
      <legend>Date of birth</legend>
      <select name="dob_month" data-expect="1"><option value="">Month</option><option value="1">January</option><option value="2">February</option><option value="3">March</option><option value="4">April</option><option value="5">May</option><option value="6">June</option><option value="7">July</option><option value="8">August</option><option value="9">September</option><option value="10">October</option><option value="11">November</option><option value="12">December</option></select>
      <select name="dob_day" data-expect="23"><option value="">Day</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option><option>13</option><option>14</option><option>15</option><option>16</option><option>17</option><option>18</option><option>19</option><option>20</option><option>21</option><option>22</option><option>23</option><option>24</option><option>25</option><option>26</option><option>27</option><option>28</option><option>29</option><option>30</option><option>31</option></select>
      <select name="dob_year" data-expect="1990"><option value="">Year</option><option>2026</option><option>2025</option><option>2024</option><option>2023</option><option>2022</option><option>2021</option><option>2020</option><option>2019</option><option>2018</option><option>2017</option><option>2016</option><option>2015</option><option>2014</option><option>2013</option><option>2012</option><option>2011</option><option>2010</option><option>2009</option><option>2008</option><option>2007</option><option>2006</option><option>2005</option><option>2004</option><option>2003</option><option>2002</option><option>2001</option><option>2000</option><option>1999</option><option>1998</option><option>1997</option><option>1996</option><option>1995</option><option>1994</option><option>1993</option><option>1992</option><option>1991</option><option>1990</option><option>1989</option><option>1988</option><option>1987</option><option>1986</option><option>1985</option><option>1984</option><option>1983</option><option>1982</option><option>1981</option><option>1980</option><option>1979</option><option>1978</option><option>1977</option><option>1976</option><option>1975</option><option>1974</option><option>1973</option><option>1972</option><option>1971</option><option>1970</option><option>1969</option><option>1968</option><option>1967</option><option>1966</option><option>1965</option><option>1964</option><option>1963</option><option>1962</option><option>1961</option><option>1960</option><option>1959</option><option>1958</option><option>1957</option><option>1956</option><option>1955</option><option>1954</option><option>1953</option><option>1952</option><option>1951</option><option>1950</option><option>1949</option><option>1948</option><option>1947</option><option>1946</option><option>1945</option><option>1944</option><option>1943</option><option>1942</option><option>1941</option><option>1940</option><option>1939</option><option>1938</option><option>1937</option><option>1936</option><option>1935</option><option>1934</option><option>1933</option><option>1932</option><option>1931</option><option>1930</option><option>1929</option><option>1928</option><option>1927</option><option>1926</option><option>1925</option><option>1924</option><option>1923</option><option>1922</option><option>1921</option><option>1920</option></select>
    </fieldset>
    <label>Gender
      <select name="gender" data-expect="m"><option value="">Prefer not to say</option><option value="f">Female</option><option value="m">Male</option></select>
    </label>
    <label>Company <input name="company" data-expect="株式会社サンプル"></label>
    <label>Search <input type="search" name="q" data-expect=""></label>
  </form>

  <h2>Contact</h2>
  <form id="contact">
    <label>Full name <input name="name" data-expect="Taro Yamada"></label>
    <label>Mailing address <textarea name="address" data-expect="1-1-1 Chiyoda, Room 101, Chiyoda-ku, Tokyo"></textarea></label>
    <label>Birthday <input name="bday" placeholder="MM/DD/YYYY" data-expect="01/23/1990"></label>
    <label>Message <textarea name="message" data-expect=""></textarea></label>
  </form>
</body>
</html>
